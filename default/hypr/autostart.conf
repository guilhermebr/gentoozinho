# Adapted from Omarchy v3.8.4 (MIT)
# Session services, started as systemd user scopes through uwsm.
exec-once = uwsm-app -- hypridle
exec-once = uwsm-app -- mako
exec-once = uwsm-app -- waybar
exec-once = uwsm-app -- swaybg -i ~/.config/gentoozinho/current/background -m fill
exec-once = uwsm-app -- /usr/libexec/polkit-gnome-authentication-agent-1

# Slow app launch fix: hand the session environment to systemd and dbus.
exec-once = systemctl --user import-environment $(env | cut -d'=' -f 1)
exec-once = dbus-update-activation-environment --systemd --all
