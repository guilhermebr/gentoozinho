# Adapted from Omarchy v3.8.4 (MIT)
# Minimal Hyprland config for the SDDM Wayland greeter.
# SDDM starts the greeter itself after the compositor is ready. Without
# layer-shell-qt the greeter is an ordinary window, so make it fill the screen.
general {
  gaps_in = 0
  gaps_out = 0
  border_size = 0
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  force_default_wallpaper = 0
}

animations {
  enabled = false
}

windowrule = fullscreen on, match:class ^(sddm-greeter|sddm-greeter-qt6)$
